<svg xmlns="http://www.w3.org/2000/svg" width="760" height="544" viewBox="0 0 760 544" role="img" aria-labelledby="title desc">
<title id="title">Hi, I'm Nam — AI, robotics, and things you can explore</title>
<desc id="desc">A short animated conversation about Nam's work: PatchBench for coding-agent evaluation, robot learning with SmolVLA, and interactive data stories. Links and demos follow below.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; font-size: 19px; }
.muted { fill: #919ba8; font-size: 12px; letter-spacing: 1.6px; }
.message { animation: arrive .35s cubic-bezier(.2,.7,.2,1) backwards; }
.typing { opacity: 0; animation: typing 1s linear; }
.dot { fill: #919ba8; animation: pulse .7s ease-in-out infinite alternate; }
@keyframes arrive { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
@keyframes typing { 0%, 85% { opacity: 1; } 100% { opacity: 0; } }
@keyframes pulse { from { opacity: .35; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .message { animation: none; } .typing { display: none; } .dot { animation: none; } }
</style>
<rect x=".5" y=".5" width="759" height="543" rx="18" fill="#0d1117" stroke="#30363d"/>
<rect x="28" y="20" width="34" height="34" rx="11" fill="#272841"/>
<text x="45" y="43" text-anchor="middle" style="fill:#a5b4fc;font-size:19px;font-weight:700">N.</text>
<text x="75" y="34" style="font-size:15px;font-weight:650">Nam / Namprire</text>
<text x="75" y="51" style="fill:#919ba8;font-size:12px">A quick introduction</text>
<text x="731" y="41" text-anchor="end" class="muted">THE OPEN NOTEBOOK</text>
<path d="M28 68H732" stroke="#212830"/>

<g transform="translate(28 84)"><g class="message" style="animation-delay:0.35s"><rect width="205" height="46" rx="18" fill="#212830"/>
<text x="18" y="29" style="">Hey, I&#x27;m Nam.</text>
</g></g>
<g transform="translate(28 142)"><g class="typing" style="animation-delay:0.10000000000000009s"><rect width="70" height="44" rx="18" fill="#212830"/>
<circle class="dot" cx="23" cy="22" r="3.5" style="animation-delay:0.0s"/>
<circle class="dot" cx="35" cy="22" r="3.5" style="animation-delay:0.16s"/>
<circle class="dot" cx="47" cy="22" r="3.5" style="animation-delay:0.32s"/>
</g></g>
<g transform="translate(28 142)"><g class="message" style="animation-delay:1.1s"><rect width="574" height="68" rx="18" fill="#212830"/>
<text x="18" y="29" style="">I build AI experiments, robotics projects,</text>
<text x="18" y="53" style="">and tools that make the results easier to explore.</text>
</g></g>
<g transform="translate(390 224)"><g class="message" style="animation-delay:2.15s"><rect width="342" height="44" rx="18" fill="#3748a0"/>
<text x="18" y="29" style="fill:#ffffff">What are you building lately?</text>
</g></g>
<g transform="translate(28 282)"><g class="typing" style="animation-delay:2.0s"><rect width="70" height="44" rx="18" fill="#212830"/>
<circle class="dot" cx="23" cy="22" r="3.5" style="animation-delay:0.0s"/>
<circle class="dot" cx="35" cy="22" r="3.5" style="animation-delay:0.16s"/>
<circle class="dot" cx="47" cy="22" r="3.5" style="animation-delay:0.32s"/>
</g></g>
<g transform="translate(28 282)"><g class="message" style="animation-delay:3.0s"><rect width="600" height="68" rx="18" fill="#212830"/>
<text x="18" y="29" style="fill:#a5b4fc;font-weight:650">PatchBench: a workbench for coding agents.</text>
<text x="18" y="53" style="">Build bug-fix tasks. Run agents. Inspect the evidence.</text>
</g></g>
<g transform="translate(28 362)"><g class="message" style="animation-delay:4.0s"><rect width="563" height="68" rx="18" fill="#212830"/>
<text x="18" y="29" style="">I also explore how robots respond to language</text>
<text x="18" y="53" style="">and tell interactive stories with data.</text>
</g></g>
<g transform="translate(28 442)"><g class="message" style="animation-delay:5.0s"><rect width="492" height="46" rx="18" fill="#212830"/>
<text x="18" y="29" style="">A few things from my workbench, below. ↘</text>
</g></g>
<text x="29" y="521" class="muted" style="font-size:10px;letter-spacing:1.35px">AI EVALUATION / ROBOT LEARNING / DATA STORIES</text>
<path d="M697 511H730M723 504L730 511L723 518" stroke="#a5b4fc" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
